site_name: FiveM Loading Screen
site_url: https://farzama.github.io/fivem-loading-screen-docs/
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - codehilite
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Build in the browser: https://loadingscreen.4zam.dev/builder.html
  - Build with AI: https://loadingscreen.4zam.dev/ai.html
  - Install & update: setup.md
  - Config reference: config-reference.md
  - Customization guides:
    - 🎨 Overview: overview.md
    - 🌐 Language & RTL: localization.md
    - 🎥 Background: background.md
    - 🏷️ Watermark: watermark.md
    - ✨ Title Animation: title-animation.md
    - 🧷 Social Headers: socials.md
    - 📜 Rules Panel: rules.md
    - 👥 Team Panel: team.md
    - 🖼️ Gallery Grid: gallery.md
    - 🧩 Custom Panel: custom-panel.md
    - ⌨️ Keyboard Overlay: keyboard-overlay.md
    - 🎵 Music Player: music-player.md
  - Troubleshooting & FAQ: troubleshooting.md
  - Changelog: changelog.md
  - Community: https://thevibe.4zam.dev/
  - Terms: https://loadingscreen.4zam.dev/terms.html
# upgrade.md stays as a short stub outside the nav (its content moved to
# setup.md#updating) so old links keep working. overview.md keeps the anchor
# the in-game error notice links to (#youtube-embed-requirements-error-handling).
validation:
  anchors: warn
extra_css:
  - stylesheets/custom-admonitions.css
