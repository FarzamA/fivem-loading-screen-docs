site_name: FiveM Loading Screen
site_url: https://farzama.github.io/fivem-loading-screen-docs/
theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - codehilite
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Build in the browser: https://loadingscreen.4zam.dev/builder.html
  - Build with AI: https://loadingscreen.4zam.dev/ai.html
  - Install & update: setup.md
  - Config reference: config-reference.md
  - Troubleshooting & FAQ: troubleshooting.md
  - Changelog: changelog.md
  - Community: https://thevibe.4zam.dev/
  - Terms: https://loadingscreen.4zam.dev/terms.html
# The old per-section pages (overview.md, background.md, socials.md and so on)
# stay as short stubs outside the nav so forum links and the in-game error
# notice (overview/#youtube-embed-requirements-error-handling) keep working.
validation:
  anchors: warn
extra_css:
  - stylesheets/custom-admonitions.css
